name: Sakano FF - Build and Publish Update

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.SAKANO_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SAKANO_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SAKANO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SAKANO_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "Missing SAKANO_KEYSTORE_BASE64" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "Missing SAKANO_STORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing SAKANO_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing SAKANO_KEY_PASSWORD" && exit 1)
      - name: Decode signing key
        run: |
          echo "${{ secrets.SAKANO_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/sakano-release.jks"
          test -s "$RUNNER_TEMP/sakano-release.jks"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build signed APK
        env:
          SAKANO_KEYSTORE_PATH: ${{ runner.temp }}/sakano-release.jks
          SAKANO_STORE_PASSWORD: ${{ secrets.SAKANO_STORE_PASSWORD }}
          SAKANO_KEY_ALIAS: ${{ secrets.SAKANO_KEY_ALIAS }}
          SAKANO_KEY_PASSWORD: ${{ secrets.SAKANO_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon
      - name: Verify APK signature
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
      - name: Prepare APK and version
        id: release
        run: |
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/release/app-release.apk "SakanoFF-$VERSION.apk"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release.outputs.version }}
          name: Sakano FF ${{ steps.release.outputs.version }}
          generate_release_notes: true
          make_latest: true
          files: SakanoFF-${{ steps.release.outputs.version }}.apk
