plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.sakano.ff'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sakano.ff'
        minSdk 26
        targetSdk 35
        versionCode 45
        versionName '4.0.5'
    }

    signingConfigs {
        release {
            def ks = System.getenv('SAKANO_KEYSTORE_PATH')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('SAKANO_STORE_PASSWORD')
                keyAlias System.getenv('SAKANO_KEY_ALIAS')
                keyPassword System.getenv('SAKANO_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}
