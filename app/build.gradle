plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.sakano.ff'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sakano.ff'
        minSdk 26
        targetSdk 35
        versionCode 38
        versionName '3.8'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}
